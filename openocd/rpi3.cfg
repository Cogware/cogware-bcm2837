# cogware-bcm2837 - OpenOCD configuration for a Raspberry Pi 3 (BCM2837)
#
# Four Cortex-A53 cores behind a single ARM DAP, wired for SMP debugging so
# that halting one core halts all four.
#
# UNTESTED ON HARDWARE. The kernel has so far only been debugged through
# QEMU's GDB stub (see docs/08-jtag-and-debugging.md). Expect to adjust the
# adapter section and the clock rate for your probe.
#
# Usage:
#
#   openocd -f interface/<your-probe>.cfg -f openocd/rpi3.cfg
#   aarch64-none-elf-gdb target/aarch64-unknown-none/release/examples/shell
#   (gdb) target extended-remote :3333
#
# Substitute your own example or kernel; the crate is a library, so the
# binary is always at target/aarch64-unknown-none/release/examples/<name>.
#
# Prerequisites on the board:
#   * enable_jtag_gpio=1 in config.txt (see firmware/config.txt), and
#   * the JTAG signals wired to GPIO 22-27 as listed there.

# --------------------------------------------------------------------------
# Transport and reset
# --------------------------------------------------------------------------

transport select jtag

# TRST is wired, SRST is not; OpenOCD still needs it declared for the reset
# state machine.
reset_config trst_and_srst

# Start slow: a marginal cable at higher speed fails in ways that look like
# silicon faults.
adapter speed 1000
jtag_ntrst_delay 500

# --------------------------------------------------------------------------
# Chip and DAP
# --------------------------------------------------------------------------

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME bcm2837
}

# ARM Debug Interface v5 DAP, the standard ARM JTAG-DP identification code.
if { [info exists DAP_TAPID] } {
    set _DAP_TAPID $DAP_TAPID
} else {
    set _DAP_TAPID 0x4ba00477
}

jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id $_DAP_TAPID -enable

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap

# --------------------------------------------------------------------------
# Cores
# --------------------------------------------------------------------------
#
# Each core exposes a debug block and a Cross Trigger Interface at a fixed
# CoreSight offset. CTIs broadcast a halt on one core to all four, so SMP
# debugging does not leave three cores running while you step the fourth.

set _TARGETNAME $_CHIPNAME.core
set _CTINAME    $_CHIPNAME.cti

set DBGBASE {0x80010000 0x80012000 0x80014000 0x80016000}
set CTIBASE {0x80018000 0x80019000 0x8001a000 0x8001b000}
set _cores 4

for { set _core 0 } { $_core < $_cores } { incr _core } {

    cti create $_CTINAME.$_core -dap $_CHIPNAME.dap -ap-num 0 \
        -baseaddr [lindex $CTIBASE $_core]

    target create $_TARGETNAME$_core aarch64 \
        -dap $_CHIPNAME.dap -coreid $_core \
        -dbgbase [lindex $DBGBASE $_core] -cti $_CTINAME.$_core

    # Re-initialise the debug logic after a reset, or the first halt after
    # reset silently does nothing.
    $_TARGETNAME$_core configure -event reset-assert-post "aarch64 dbginit"

    # GDB expects a halted target when it attaches.
    $_TARGETNAME$_core configure -event gdb-attach { halt }
}

# Groups all four cores so halt/resume/step apply to the set, matching the
# four GDB threads seen against the QEMU stub.
target smp ${_TARGETNAME}0 ${_TARGETNAME}1 ${_TARGETNAME}2 ${_TARGETNAME}3

# --------------------------------------------------------------------------
# Convenience procedures
# --------------------------------------------------------------------------

# Loads the ELF over JTAG instead of booting from the SD card, for iterating
# without swapping cards.
#
# Takes the example name, defaulting to the full reference kernel:
#   > load_kernel
#   > load_kernel hello-uart
proc load_kernel { {example shell} } {
    halt
    load_image target/aarch64-unknown-none/release/examples/$example
    reg pc 0x80000
    echo "$example loaded at 0x80000, pc set; 'resume' to run"
}

# Dump the state the kernel cares about most at a halt: which exception level
# each core is in, and whether the MMU publication gate has opened.
#
#   MMU_GATE holds 0x5747415445 4F4B21 ("WGATEOK!") once core 0 has finished
#   building the translation tables. If a secondary is stuck, this is the
#   first thing to read - see docs/04-smp.md.
proc kernel_state { } {
    halt
    foreach t [target names] {
        echo "--- $t ---"
        $t arm reg cpsr
        $t arm reg pc
    }
}
